server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: naejeonhaja
  config:
    import: optional:file:.env[.properties]
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/naejeonhaja}
    username: ${DB_USERNAME:naejeonhaja}
    password: ${DB_PASSWORD:naejeonhaja}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

riot:
  api:
    key: ${RIOT_API_KEY:}
    regional-base-url: ${RIOT_REGIONAL_BASE_URL:https://asia.api.riotgames.com}
    platform-base-url: ${RIOT_PLATFORM_BASE_URL:https://kr.api.riotgames.com}
    default-tag-line: ${RIOT_DEFAULT_TAG_LINE:KR1}
    # 호출 한도 "횟수:초" (개발용 키 20/1초, 100/2분 → 여유 두고 18, 95)
    rate-limits: ${RIOT_RATE_LIMITS:18:1,95:120}
    max-wait-ms: 4000

ddragon:
  base-url: ${DDRAGON_BASE_URL:https://ddragon.leagueoflegends.com}
  locale: ko_KR
  fallback-version: 16.21.1

lol:
  balance:
    # 서브 라인에 배정된 플레이어의 MMR 감점 (세부 티어 1단계 = 50)
    sub-line-penalty: ${LOL_SUB_LINE_PENALTY:100}
    # 라인을 지키는 조합이 없어 고르지 않은 라인에 배정할 때의 감점
    off-role-penalty: ${LOL_OFF_ROLE_PENALTY:250}
    # 최적 조합 외에 함께 돌려줄 차선 조합 수
    alternatives: 4
  insight:
    # 라인 분석(모스트 3)에 쓸 이번 시즌 랭크 경기 수
    sample: ${LOL_INSIGHT_SAMPLE:20}
    # 이번 시즌 시작일 yyyy-MM-dd (비우면 올해 1월 1일)
    season-start: ${LOL_SEASON_START:}

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  admin-token: ${APP_ADMIN_TOKEN:}
  # 방 입장 토큰 서명 키 (비우면 처음 실행 시 자동 생성해 DB 에 저장)
  secret: ${APP_SECRET:}

springdoc:
  swagger-ui:
    path: /docs
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /api-docs
  writer-with-default-pretty-printer: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
